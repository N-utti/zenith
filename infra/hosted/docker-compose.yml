# 외부 호스팅 — 공유 스택. 회사마다 따로 뜨는 api 는 ./tenant.yml, 회사 추가는 ./tenant.sh (README.md).
# 2026-11-09 결정(A안): Postgres 하나에 회사별 DB·계정, 회사별 api 컨테이너, caddy 가 호스트 이름으로 나눈다.
# db·minio·ollama·hwp 는 단일 스택 정의(../docker-compose.yml)를 그대로 물려받고 다른 것만 덮는다.
#
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#   ./tenant.sh add acme "에이씨엠이" admin@acme.co.kr
#
# ponytail: redis 는 없다 — 코드가 아직 안 쓴다(backend/CLAUDE.md). 쓰기 시작하면 회사별 redis 를 tenant.yml 에 둔다
# (DB 번호 분리는 16개 한계 + 격리가 아니다).
name: zenith-hosted

services:
  caddy:
    build:
      context: ../..
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    environment:
      # 회사 주소는 <회사>.<ZENITH_DOMAIN>. DNS 에 `*.<ZENITH_DOMAIN>` A 레코드가 이 서버를 가리켜야 한다.
      ZENITH_DOMAIN: ${ZENITH_DOMAIN:?infra/hosted/.env 에 ZENITH_DOMAIN}
      # Let's Encrypt 계정 이메일(인증서는 회사 호스트마다 자동 발급) 또는 `internal`(로컬 시험용 자체 CA)
      ZENITH_TLS: ${ZENITH_TLS:?infra/hosted/.env 에 ZENITH_TLS}
    ports:
      - "${ZENITH_HTTP_PORT:-80}:80"
      - "${ZENITH_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/zenith.caddy:/etc/caddy/zenith.caddy:ro
      - ./sites:/etc/caddy/sites:ro  # 회사별 사이트 블록 — tenant.sh 가 쓴다(미커밋)
      - caddy_data:/data
      - caddy_config:/config

  db:
    extends:
      file: ../docker-compose.yml
      service: db
    environment:
      # 슈퍼유저(zenith). 회사 api 는 이 계정을 모른다 — 각자 자기 DB 만 여는 계정(zt_<회사>)을 쓴다.
      POSTGRES_PASSWORD: ${ZENITH_DB_PASSWORD:?infra/hosted/.env 에 ZENITH_DB_PASSWORD}
    # api 하나가 풀로 최대 15개(SQLAlchemy 기본 5+10)를 잡는다. 회사 계정마다 CONNECTION LIMIT 20(tenant.sh).
    command: postgres -c max_connections=${ZENITH_PG_MAX_CONN:-300}

  minio:
    extends:
      file: ../docker-compose.yml
      service: minio
    environment:
      MINIO_ROOT_PASSWORD: ${ZENITH_MINIO_PASSWORD:?infra/hosted/.env 에 ZENITH_MINIO_PASSWORD}

  ollama:
    # 임베딩만, 회사 데이터를 저장하지 않는다 — 전 회사가 같이 쓴다.
    extends:
      file: ../docker-compose.yml
      service: ollama

  hwp:
    extends:
      file: ../docker-compose.yml
      service: hwp

  backup:
    # 회사 DB(zt_*)마다 일일 pg_dump. 단일 스택의 backup 과 같은 규칙(0600·임시 이름·성공해야 옛 것 삭제).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: zenith
      PGPASSWORD: ${ZENITH_DB_PASSWORD:?}
      PGDATABASE: zenith
      TZ: Asia/Seoul
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        while :; do
          # 재부팅 때 db 와 같이 뜬다 — 기다리지 않으면 그날 백업이 통째로 빠진다(단일 스택과 같다).
          until pg_isready -q; do sleep 5; done
          ok=1
          dbs=$$(psql -Atc "select datname from pg_database where datname like 'zt\_%'") || ok=0
          for d in $$dbs; do
            if pg_dump -Fc -d "$$d" -f /backups/.partial.dump && mv /backups/.partial.dump "/backups/$$d-$$(date +%F).dump"; then
              find /backups -name "$$d-*.dump" -mtime +14 -delete
            else
              echo "backup FAILED $$d $$(date -Is)" >&2
              ok=0
            fi
          done
          # 전 회사 첨부 파일(MinIO 볼륨 — 회사별 접근 키도 .minio.sys 에 있다). tar 종료 1 은 「읽는 중 바뀜」이라 넘어간다.
          # ponytail: 매일 통째로 묶는다 — 수 GB 로 커지면 증분(`mc mirror`·rsync)으로.
          tar -czf /backups/.partial.tgz --exclude=./.minio.sys/tmp --exclude=./.minio.sys/multipart -C /miniodata .
          if [ $$? -le 1 ] && mv /backups/.partial.tgz /backups/files-$$(date +%F).tgz; then
            find /backups -name 'files-*.tgz' -mtime +14 -delete
          else
            echo "backup FAILED files $$(date -Is)" >&2
            ok=0
          fi
          if [ $$ok = 1 ]; then sleep 86400; else sleep 600; fi  # 실패면 하루를 기다리지 않고 다시
        done
    volumes:
      - ${ZENITH_BACKUP_DIR:-./backups}:/backups
      - miniodata:/miniodata:ro
    depends_on:
      db:
        condition: service_healthy

networks:
  # 이름을 못박는다 — 회사 스택(tenant.yml)이 external 로 붙는다.
  default:
    name: zenith_hosted
  hwp_net:
    name: zenith_hosted_hwp
    internal: true

volumes:
  pgdata:
  miniodata:
  ollama:
  caddy_data:
  caddy_config:
