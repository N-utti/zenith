# ARCHITECTURE §7 골격: caddy(TLS·리버스 프록시·정적 web) · api · db · redis · minio · backup(일일 pg_dump).
# yjs 컨테이너는 없다(릴레이가 api 안). 답변 생성은 Claude API(2026-09-04 결정) — ollama 는 임베딩(bge-m3)만 돌린다
# (backend/README 45). 설치 때 한 번 `docker compose exec ollama ollama pull bge-m3`(약 1.2GB, 인터넷 필요).
#
#   docker compose up -d db              # 개발: DB만 (api 는 uv 로, 프론트는 vite 로)
#   docker compose up -d --build         # 전부 — https://localhost 로 접속 (api·web 이미지 빌드)
#
# 이 PC처럼 5432 가 다른 프로젝트에 잡혀 있으면 호스트 포트만 바꾼다:
#   ZENITH_DB_PORT=5434 docker compose up -d
# db·redis·minio 의 호스트 포트는 127.0.0.1 에만 묶인다(개발 PC 에서 psql·콘솔용) — 사내망의 다른 PC 에서는 안 보인다.
# 비밀번호 기본값(zenith)은 개발용이다. 서버에서는 ZENITH_DB_PASSWORD·ZENITH_MINIO_PASSWORD 를 바꾼다(infra/README).

services:
  caddy:
    # 프론트 빌드(Vite dist)를 이미지에 넣고 file_server 로 내보내며 /api/* 를 api 로 넘긴다. 라우팅은 caddy/Caddyfile.
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    environment:
      # 인증서의 사이트 이름. 사내 DNS 이름이나 IP 로 바꾼다(브라우저 주소창과 같아야 한다).
      ZENITH_SITE: ${ZENITH_SITE:-localhost}
      # 비면 자체 CA(internal). 인증서 파일을 쓰면 `/certs/cert.pem /certs/key.pem`(caddy/Caddyfile 의 tls 줄)
      ZENITH_TLS: ${ZENITH_TLS:-internal}
      # 사내망 평문 HTTP 사이트 주소(caddy/Caddyfile). 안 주면 localhost 만 받아 사실상 꺼진 것과 같다
      ZENITH_LAN_SITE: ${ZENITH_LAN_SITE:-http://localhost:5180}
    ports:
      - "${ZENITH_HTTP_PORT:-80}:80"
      - "${ZENITH_HTTPS_PORT:-443}:443"
      # 사내망 평문 HTTP(caddy/Caddyfile 의 ZENITH_LAN_SITE). 안 쓰면 localhost 만 받아 빈 응답
      - "${ZENITH_LAN_PORT:-5180}:5180"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro  # 비어 있어도 된다 — ZENITH_TLS 가 파일을 가리킬 때만 읽는다(미커밋, .gitignore)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: ${ZENITH_DB_PASSWORD:-zenith}
      POSTGRES_DB: zenith
    ports:
      - "127.0.0.1:${ZENITH_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith -d zenith"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZENITH_REDIS_PORT:-6379}:6379"

  minio:
    # 조직 레지스트리의 미러 — MinIO 가 공개 이미지 배포를 멈췄다(Docker Hub 에 이어 2026-09-30 quay.io 도 401).
    # 비공개 패키지라 서버에서 한 번 `docker login ghcr.io` 가 필요하다(infra/README "MinIO 이미지").
    # CI(.github/workflows/ci.yml)도 같은 태그.
    image: ghcr.io/n-utti/zenith-minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zenith
      MINIO_ROOT_PASSWORD: ${ZENITH_MINIO_PASSWORD:-zenith-minio}
    ports:
      - "127.0.0.1:${ZENITH_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${ZENITH_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  ollama:
    # 임베딩(bge-m3)만 — AI 근거의 벡터 검색(backend/README 45). 호스트 포트 없음, api 가 compose 망 안에서
    # ollama:11434 로 부른다. 모델은 볼륨에 둔다: 설치 때 `docker compose exec ollama ollama pull bge-m3`.
    # 메모리 약 1.5GB(모델 1.2GB + 런타임). 모델이 없으면 api 는 로그에 색인 실패를 남기고 핵심어 검색으로만 답한다.
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  api:
    build: ../backend
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      # 같은 db 컨테이너 안의 다른 DB·버킷을 쓸 때(이 PC 의 실테스트 zenith_live) 이름만 바꾼다
      DATABASE_URL: postgresql+asyncpg://zenith:${ZENITH_DB_PASSWORD:-zenith}@db:5432/${ZENITH_DB_NAME:-zenith}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_SECRET_KEY: ${ZENITH_MINIO_PASSWORD:-zenith-minio}
      MINIO_BUCKET: ${ZENITH_MINIO_BUCKET:-zenith}
      # 벡터 검색(backend/README 45). 빈 문자열이면 꺼진다(핵심어 검색만).
      EMBED_URL: ${ZENITH_EMBED_URL-http://ollama:11434}
      # caddy 가 TLS 를 끝내므로 Secure 쿠키. caddy 없이 api 에 평문 http 로 붙는 실험에서만 false.
      COOKIE_SECURE: ${ZENITH_COOKIE_SECURE:-true}
      # JWT_SECRET 은 backend/.env 로 넣는다 (기본값 없음 — 비어 있으면 api 가 뜨지 않는다).
    # 기동 때 스키마를 최신으로 올린다. 실패하면 uvicorn 을 띄우지 않는다.
    command: >
      sh -c "uv run --no-dev alembic upgrade head
      && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 1048576"
    # 호스트 포트를 열지 않는다 — 브라우저는 caddy(https)로만 들어온다. 평문 http 의 api 는 Secure 쿠키를 못 심는다.
    depends_on:
      db:
        condition: service_healthy

  backup:
    # 일일 pg_dump(custom 포맷, 14일 지난 것 삭제) → 호스트 ZENITH_BACKUP_DIR(기본 ./backups). 복구는 infra/README.
    # ponytail: sleep 루프다 — 컨테이너가 뜬 시각 기준 24시간마다. 새벽 고정이 필요하면 호스트 cron 으로.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: zenith
      PGPASSWORD: ${ZENITH_DB_PASSWORD:-zenith}
      PGDATABASE: ${ZENITH_DB_NAME:-zenith}
      TZ: Asia/Seoul
    # 덤프에는 전 계정(해시)·전 문서·채팅이 들어 있다 — umask 077 로 0600. 임시 이름에 쓰고 성공해야 날짜 이름으로 옮긴다
    # (잘린 파일이 정상 백업처럼 남지 않게). 실패는 로그에 남긴다(조용히 14일 뒤 백업 0 이 되지 않게).
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        while :; do
          if pg_dump -Fc -f /backups/.partial.dump && mv /backups/.partial.dump /backups/zenith-$$(date +%F).dump; then
            find /backups -name 'zenith-*.dump' -mtime +14 -delete
          else
            echo "backup FAILED $$(date -Is)" >&2
          fi
          sleep 86400
        done
    volumes:
      - ${ZENITH_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  ollama:
  caddy_data:
  caddy_config:
