[project]
name = "zenith-backend"
version = "0.1.0"
description = "제니스(Zenith) 백엔드 — FastAPI · PostgreSQL 16 + pgvector · Redis · MinIO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pgvector>=0.3",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "anthropic>=1.0",
  "pycrdt>=0.14.4",
  "minio>=7.2",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1.5",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "httpx-ws>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: ruff는 한글을 폭 2로 세어 주석·문자열이 걸린다. 코드 줄 폭은 `ruff format`이 지킨다.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]  # editable 설치라 site-packages 에 보여 서드파티로 오인된다

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
